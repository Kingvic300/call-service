# coturn configuration for the call-service TURN/STUN server.
# Reference: https://github.com/coturn/coturn/blob/master/docker/coturn/README.md
#
# IMPORTANT: replace every CHANGE_ME below before deploying, and keep
# static-auth-secret in sync with the TURN_SECRET env var CoturnService uses
# to derive time-limited client credentials (see src/coturn/coturn.service.ts).

listening-port=3478
tls-listening-port=5349

# Separate, non-overlapping range from mediasoup's MEDIASOUP_MIN_PORT/MAX_PORT
# (40000-44999 by default) — both processes share the host network.
min-port=45000
max-port=45999

# Time-limited REST API credentials (see coturn's turn-rest-api.md). No
# per-user accounts to provision or rotate — only this one shared secret.
use-auth-secret
static-auth-secret=CHANGE_ME_TURN_SECRET
realm=call-service

# Public IP(s) coturn should advertise to clients — required behind NAT.
# external-ip=CHANGE_ME_PUBLIC_IP

# TLS certs for turns:// (recommended in production; comment out for local dev).
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem

fingerprint
lt-cred-mech
no-multicast-peers
no-cli
# Never relay to/from RFC1918 private ranges — prevents coturn being used as
# an open relay into your internal network.
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

log-file=stdout
verbose
