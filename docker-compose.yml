version: '3.9'

services:
  call-service:
    build: .
    # On the droplet itself, prefer pulling a pre-built image instead of
    # `build: .` here — see docs/DEPLOYMENT.md. Set CALL_SERVICE_IMAGE and
    # comment out the `build:` line once you're pulling from a registry.
    image: ${CALL_SERVICE_IMAGE:-call-service:latest}
    restart: unless-stopped
    # Host networking: the app binds directly to the droplet's network stack,
    # no per-port Docker NAT/iptables overhead. This is what makes a single
    # mediasoup port (see MEDIASOUP_WEBRTC_PORT) actually simple to run —
    # Linux-only, which is exactly what a droplet is.
    network_mode: host
    # Keep V8's heap bounded so a busy meeting can't starve the mediasoup
    # worker processes of memory on a small droplet. Raise on a bigger box.
    mem_limit: ${CALL_SERVICE_MEM_LIMIT:-900m}
    environment:
      NODE_ENV: production
      PORT: 4000
      SERVICE_CREDENTIALS: ${SERVICE_CREDENTIALS}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      # Unset by default (single-instance mode, unchanged behavior). Export
      # REDIS_URL before `docker compose --profile scaling up` to turn this
      # instance into "instance A" of a multi-instance fleet alongside
      # call-service-b below.
      REDIS_URL: ${REDIS_URL:-}
      INSTANCE_ID: ${INSTANCE_ID:-call-service-a}
      INSTANCE_INTERNAL_URL: ${INSTANCE_INTERNAL_URL:-http://127.0.0.1:4000}
      MEDIASOUP_NUM_WORKERS: ${MEDIASOUP_NUM_WORKERS:-1}
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP}
      MEDIASOUP_WEBRTC_PORT: 44000
      TURN_HOST: ${TURN_HOST}
      TURN_PORT: 3478
      TURN_TLS_PORT: 5349
      TURN_SECRET: ${TURN_SECRET}
    depends_on:
      - coturn
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4000/health']
      interval: 30s
      timeout: 5s
      retries: 3

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    mem_limit: 128m
    volumes:
      - ./docker/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ['-c', '/etc/coturn/turnserver.conf']

  # Optional — only needed once you run more than one call-service instance
  # behind a load balancer (fans Socket.IO broadcasts out across instances,
  # backs the meeting-ownership directory). Not relevant to a
  # single-droplet MVP deployment.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ['scaling']
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--bind', '127.0.0.1', '-::1']
    ports:
      - '127.0.0.1:6379:6379'

  # A second call-service instance, for local multi-instance testing (see
  # scripts/cross-instance-test.js and docs/INTEGRATION.md "Multi-instance
  # deployment"). Both instances share `network_mode: host`, so PORT and
  # MEDIASOUP_WEBRTC_PORT must not collide with instance A's — that's the
  # only reason this exists as a near-duplicate service instead of a
  # `--scale` flag on `call-service`, which would try to reuse the same
  # ports. Requires `redis` (`--profile scaling`) to actually behave as a
  # second instance of the same fleet rather than an unrelated standalone
  # service.
  call-service-b:
    build: .
    image: ${CALL_SERVICE_IMAGE:-call-service:latest}
    restart: unless-stopped
    network_mode: host
    mem_limit: ${CALL_SERVICE_MEM_LIMIT:-900m}
    profiles: ['scaling']
    environment:
      NODE_ENV: production
      PORT: 4001
      SERVICE_CREDENTIALS: ${SERVICE_CREDENTIALS}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      REDIS_URL: redis://:${REDIS_PASSWORD}@127.0.0.1:6379
      INSTANCE_ID: call-service-b
      INSTANCE_INTERNAL_URL: http://127.0.0.1:4001
      MEDIASOUP_NUM_WORKERS: ${MEDIASOUP_NUM_WORKERS:-1}
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP}
      MEDIASOUP_WEBRTC_PORT: 44010
      TURN_HOST: ${TURN_HOST}
      TURN_PORT: 3478
      TURN_TLS_PORT: 5349
      TURN_SECRET: ${TURN_SECRET}
    depends_on:
      - coturn
      - redis
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4001/health']
      interval: 30s
      timeout: 5s
      retries: 3
